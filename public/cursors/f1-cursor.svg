<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64" fill="none" aria-label="Formula racing car mouse cursor">
  <!-- Cursor hotspot: (10, 10) in the 48px rendered image, at the car's nose. -->
  <g transform="translate(-18 9) rotate(-45 32 5)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Exposed wheels -->
    <g fill="#171B23" stroke="#F7F8FA" stroke-width="1.9">
      <rect x="11.3" y="16.7" width="10.5" height="16.1" rx="3.1"/>
      <rect x="42.2" y="16.7" width="10.5" height="16.1" rx="3.1"/>
      <rect x="10.9" y="39.4" width="11.3" height="15.7" rx="3.1"/>
      <rect x="41.8" y="39.4" width="11.3" height="15.7" rx="3.1"/>
    </g>
    <!-- Tire grooves, just enough to read at cursor size -->
    <g stroke="#656D7A" stroke-width="1.55" opacity=".9">
      <path d="M14.4 20.7v7.8M49.6 20.7v7.8M14.3 43.2v8M49.7 43.2v8"/>
    </g>
    <!-- Rear aero wing and support -->
    <path d="M26 46v7.9M38 46v7.9" stroke="#202630" stroke-width="3.8"/>
    <path d="M17.2 53.8h29.6v6H17.2z" fill="#151922" stroke="#F8FAFC" stroke-width="1.8"/>
    <path d="M20.2 54.9h23.6" stroke="#FF565B" stroke-width="1.8"/>
    <!-- Main chassis and sidepods -->
    <path d="M27.1 22.6 22.3 29.4 18.8 42.8 24.6 50.7H39.4l5.8-7.9-3.5-13.4-4.8-6.8Z" fill="#E93445" stroke="#18202B" stroke-width="2.3"/>
    <path d="m22.7 33.4-2.7 8.9 4 4.2 2.3-12.9ZM41.3 33.4l2.7 8.9-4 4.2-2.3-12.9Z" fill="#FF8588" opacity=".85"/>
    <!-- Rear engine cover -->
    <path d="M27.2 42.6h9.6l2.6 8.2H24.6z" fill="#B91532"/>
    <path d="M32 44v6.4" stroke="#FFF4ED" stroke-width="2.2"/>
    <!-- Nose, with a sharply defined clicking tip -->
    <path d="M32 5 36.5 27.8 38.3 35.4H25.7l1.8-7.6Z" fill="#FF424E" stroke="#19212D" stroke-width="2.2"/>
    <path d="M32 9.5v16.3" stroke="#FFF5EA" stroke-width="2.25"/>
    <!-- Front wing -->
    <path d="m16.2 14.7 13.6 3.9h4.4l13.6-3.9 2.2 6.1-14.6 2.9h-6.8L14 20.8z" fill="#141B25" stroke="#F8FAFC" stroke-width="1.8"/>
    <path d="m18.4 17.5 10.4 3M45.6 17.5l-10.4 3" stroke="#FF5B61" stroke-width="1.9"/>
    <path d="M14.2 15.9v5.6M49.8 15.9v5.6" stroke="#FF5B61" stroke-width="2.7"/>
    <!-- Cockpit and halo -->
    <path d="M32 27.8c-4.7 0-7.8 3.7-7.8 9.4 0 5.3 3.3 8.7 7.8 8.7s7.8-3.4 7.8-8.7c0-5.7-3.1-9.4-7.8-9.4Z" fill="#151D28" stroke="#FFBDC1" stroke-width="1.5"/>
    <path d="M27.5 33.4c1-2.4 2.6-3.7 4.5-3.7s3.5 1.3 4.5 3.7" stroke="#B8F3FF" stroke-width="2.4"/>
    <path d="M32 31.1v9.4" stroke="#9DAAB9" stroke-width="1.7"/>
  </g>
</svg>
